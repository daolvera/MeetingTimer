<div class="modal-header">
  <h4 class="modal-title pull-left">
    {{ isEditMode ? "Edit" : "Create" }} Speaker
  </h4>
  <button
    type="button"
    class="btn-close close pull-right"
    aria-label="Close"
    (click)="modalService.hide()"
  >
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<form [formGroup]="speakerForm" (ngSubmit)="saveSpeaker()">
  <div class="modal-body">
    <div class="row">
      <!-- Basic Information -->
      <div class="col-12">
        <h6 class="text-primary mb-3">Basic Information</h6>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Name *</label>
        <input
          formControlName="name"
          class="form-control"
          placeholder="Full name"
        />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Email *</label>
        <input
          formControlName="email"
          type="email"
          class="form-control"
          placeholder="email@example.com"
        />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Phone</label>
        <input
          formControlName="phone"
          class="form-control"
          placeholder="+1 (555) 123-4567"
        />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Company</label>
        <input
          formControlName="company"
          class="form-control"
          placeholder="Company name"
        />
      </div>
      <div class="col-12">
        <label class="form-label">Job Title</label>
        <input
          formControlName="jobTitle"
          class="form-control"
          placeholder="Position or role"
        />
      </div>
      <div class="col-12">
        <label class="form-label">Biography</label>
        <textarea
          formControlName="biography"
          class="form-control"
          rows="3"
          placeholder="Brief biography or description"
        ></textarea>
      </div>

      <!-- Social Links -->
      <div class="col-12 mt-4">
        <h6 class="text-primary mb-3">Social Links</h6>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">LinkedIn</label>
        <input
          formControlName="linkedIn"
          class="form-control"
          placeholder="https://linkedin.com/in/username"
        />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Twitter</label>
        <input
          formControlName="twitter"
          class="form-control"
          placeholder="https://twitter.com/username"
        />
      </div>
      <div class="col-12">
        <label class="form-label">Website</label>
        <input
          formControlName="website"
          class="form-control"
          placeholder="https://example.com"
        />
      </div>

      <!-- Availability -->
      <div class="col-12 mt-4">
        <h6 class="text-primary mb-3">Availability</h6>
      </div>
      <div class="col-12 col-md-4">
        <div class="form-check">
          <input
            formControlName="isAvailable"
            class="form-check-input"
            type="checkbox"
            id="isAvailable"
          />
          <label class="form-check-label" for="isAvailable">
            Available for speaking
          </label>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Available From</label>
        <input
          formControlName="availableFrom"
          type="date"
          class="form-control"
        />
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Available To</label>
        <input formControlName="availableTo" type="date" class="form-control" />
      </div>
    </div>

    <!-- Error Message -->
    @if (errorMessage){
    <div class="alert alert-danger mt-3">
      {{ errorMessage }}
    </div>
    }
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="modalService.hide()"
    >
      Close
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="!speakerForm.valid"
    >
      Save changes
    </button>
  </div>
</form>
